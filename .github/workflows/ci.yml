name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ===== relay-server 单元测试 + 端到端测试 =====
  relay-server-test:
    name: Relay Server Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run relay-server tests
        run: ./gradlew :relay-server:test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relay-server-test-results
          path: relay-server/build/reports/tests/
          retention-days: 7

  # ===== Android app 单元测试 =====
  android-unit-test:
    name: Android Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-results
          path: app/build/reports/tests/
          retention-days: 7

  # ===== 编译验证 =====
  build:
    name: Build Debug APK & Relay Server
    runs-on: ubuntu-latest
    needs: [ relay-server-test, android-unit-test ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Build relay-server
        run: ./gradlew :relay-server:installDist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload relay-server
        uses: actions/upload-artifact@v4
        with:
          name: relay-server-dist
          path: relay-server/build/install/relay-server/
          retention-days: 14
